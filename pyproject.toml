[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortana"
version = "0.2.6"
description = "Cortana: local AI assistant for macOS and Linux"

readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Nave433 (Evan Shipley)"}]
keywords = ["ai", "coding-assistant", "ollama", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.25.1",
    "rich>=15.0.0",
    "requests>=2.34.2",
    "watchdog>=6.0.0",
    "sounddevice>=0.5.5",
    "scipy>=1.17.1",
    "numpy>=2.4.6",
    "faiss-cpu>=1.13.2",
    "SpeechRecognition>=3.16.1",
    "prompt_toolkit>=3.0.52",
    "dropbox>=12.0.2",
    "google-api-python-client>=2.196.0",
    "google-auth-oauthlib>=1.4.0",
    "markdown>=3.10.2",
    "keyring>=25.7.0",
    "paramiko>=5.0.0",
    "psutil>=7.2.2",
    "ddgs>=9.14.4",
    "litellm>=1.85.1",
    "typing-extensions>=4.15.0",
    "packaging>=24.0",
    "urllib3>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "jsonschema"
]

[project.urls]
Homepage = "https://github.com/nave433-blip/jarvis-dev"

[project.scripts]
cortana = "cli:app"
cortana-thin = "tools.ollama_thin:main"
# Deprecated alias: prints a rename notice, then forwards to cortana.
jarvis = "cli:jarvis_shim"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "tools", "watcher", "voice", "memory", "cortana_core"]

