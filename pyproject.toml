[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-dev"
version = "0.2.6"
description = "Local AI coding assistant for macOS"

readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
keywords = ["ai", "coding-assistant", "ollama", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
]
dependencies = [
    "typer",
    "rich",
    "requests",
    "watchdog",
    "sounddevice",
    "scipy",
    "numpy",
    "sentence-transformers",
    "faiss-cpu",
    "SpeechRecognition",
    "prompt_toolkit",
    "dropbox",
    "google-api-python-client",
    "google-auth-oauthlib",
    "markdown",
    "keyring",
    "Pillow",
    "paramiko",
    "psutil",
    "duckduckgo-search",
    "litellm",
    "typing-extensions",
    "botocore",
    "boto3"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "jsonschema"
]

[project.urls]
Homepage = "https://github.com/yourusername/jarvis-dev"

[project.scripts]
jarvis = "cli:app"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "tools", "watcher", "voice", "memory"]

